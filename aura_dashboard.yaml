# ════════════════════════════════════════════════════════════════════════════
#  AURA – ett helt nytt utseende för Home Assistant
#  Kräver bara: custom:button-card (HACS). Kiosk-mode är valfritt.
#
#  Klistra in allt i en NY dashboard:
#    Inställningar → Instrumentpaneler → Lägg till → "Ny instrumentpanel från början"
#    → öppna den → ⋮ → Redigera → ⋮ → Raw-konfigurationsredigerare → klistra in → Spara
#
#  Allt som är unikt för ditt hem ändrar du i "mitt_hem" här nedanför.
# ════════════════════════════════════════════════════════════════════════════
kiosk_mode:
  mobile_settings:
    custom_width: 1400
    hide_header: true
button_card_templates:
  mitt_hem:
    variables:
      # ---------- Utseende ----------
      _hem_namn: Symfonigatan 7
      _plats: Borås
      _tema: ljus                 # ljus (kräm & brons), mork (marin & indigo) eller noir (svart & champagne) – kan även bytas under Hushåll
      _accent: ''                 # tomt = temats egen färg, annars t.ex. '#B07D3A' eller '#7568FF'
      _bakgrundsbild: /local/rum/oversikt.jpg   # bilden överst på Hem. Tomt = mönster

      # ---------- Rum och lampor ----------
      # Varje rum blir ett kort på Hem och en egen rad med lamprutor under Ljus.
      # Lampor kan skrivas bara som entitet, eller med eget namn/ikon.
      # Tom lista (_rum: []) = rummen och lamporna hämtas automatiskt från dina områden i HA.
      _rum:
        - namn: Vardagsrum
          bild: /local/rum/vardagsrum.jpg   # egen bild för rummet (lägg filen i config/www/rum/)
          ikon: mdi:sofa-outline
          temp: sensor.temp_vardagsrum_temperatur
          fukt: sensor.temp_vardagsrum_luftfuktighet
          lampor:
            - entity: light.shellydimmer2_e8db84d44d28
              namn: Sofflampan
              ikon: mdi:sofa-outline
              typ: krona               # bilden: tak, klot, krona, golv, bord, glod, stake, mane, uttag – eller egen bild /local/lampor/x.png
            - entity: light.golvlampa
              namn: Golvlampa
              ikon: mdi:floor-lamp-outline
            - entity: light.fonsterlampor_nere
              namn: Fönsterlampor
              ikon: mdi:lamps
              typ: bord
        - namn: Kök & hall
          bild: /local/rum/kok.jpg
          ikon: mdi:silverware-fork-knife
          lampor:
            - entity: light.koksbordet
              namn: Köksbordet
              ikon: mdi:ceiling-light
            - entity: light.hallbelysning
              namn: Hallen
              ikon: mdi:coat-rack
              typ: klot
        - namn: Övervåningen
          bild: /local/rum/overvaning.jpg
          ikon: mdi:bed-outline
          temp: sensor.temp_overvaningen_temperatur
          fukt: sensor.temp_overvaningen_luftfuktighet
          lampor:
            - entity: light.melvins_sanglampa
              namn: Melvins lampa
              ikon: mdi:lamp-outline
            - entity: switch.fonster_sovrum_uttag
              namn: Fönster sovrum
              ikon: mdi:window-closed-variant
            - entity: switch.manen_uttag
              namn: Månen
              ikon: mdi:moon-waning-crescent

      # ---------- Scener och ljuseffekter ----------
      _scener:                    # tom lista = alla scener
        - entity: scene.mysbelysning
          namn: Mys
          ikon: mdi:candle
          farg: '#FBBF24'
        - entity: scene.middagsbelysning
          namn: Middag
          ikon: mdi:silverware-fork-knife
          farg: '#FB923C'
        - entity: scene.filmbelysning
          namn: Film
          ikon: mdi:movie-open-outline
          farg: '#22D3EE'
        - entity: scene.god_natt
          namn: God natt
          ikon: mdi:weather-night
          farg: '#A78BFA'
      _slack_allt: script.slack_allt_om_5_minuter
      _slack_minuter: 5
      _ljuseffekt: input_select.ljuseffekt
      _ljuseffekt_script: script.ljuseffekt_knapp
      _ljuseffekter:              # tom lista = ingen rad med effekter
        - effekt: norrsken
          namn: Norrsken
          ikon: mdi:weather-night
        - effekt: stamning
          namn: Stämning
          ikon: mdi:candle
        - effekt: fargsnurr
          namn: Färgsnurr
          ikon: mdi:palette

      _party_script: script.partylage   # Partyläge under Ljuseffekter (lägg in party_script.yaml) – tomt = ingen knapp
      _party_lampor: []           # tom = alla färglampor i dina rum, annars t.ex. [light.sofflampan, light.golvlampa]

      # ---------- Media ----------
      _mediaspelare:              # en eller flera – tom lista = alla mediaspelare
        - media_player.vardagsrum_3
        - media_player.vardagsrum_2   # Apple TV – visar fjärrkontroll och appar i stället för bibliotek
      _party_skarm: https://app.music-assistant.io/stable/#/party   # Music Assistants partyskärm (flik "Party")
      _party_url: ""                # eller gästlänken till partyt – då visas en QR-kod i stället

      # ---------- Energi (Tibber) ----------
      _elpris: sensor.tibber_prices
      _el_prefix: symfonigatan_7  # månadskostnaden läses från sensor.<prefix>_manadskostnad
      _elomrade: SE3
      _el_billig: 1               # kr/kWh – under detta är det billigt
      _el_dyr: 2                  # kr/kWh – över detta är det dyrt

      # ---------- Solceller (lämna tomt tills du har solceller – då syns inget) ----------
      _sol_effekt: ''             # vad panelerna ger JUST NU, W eller kW   (ex. sensor.solar_power)
      _sol_idag: ''               # producerat idag, kWh                    (ex. sensor.solar_energy_today)
      _sol_salt: ''               # sålt till nätet idag, kWh   – valfritt
      _husets_effekt: ''          # vad huset drar just nu, W   – valfritt (visar överskott)
      _sol_prognos: ''            # Forecast.Solar: prognos idag, kWh – valfritt
      _sol_max_kw: 0              # anläggningens toppeffekt i kW, t.ex. 10 – valfritt

      # ---------- Hembatteri (lämna tomt om du inte har något – då syns inget) ----------
      _batteri_niva: ''           # laddnivå i %                         (ex. sensor.battery_state_of_charge)
      _batteri_effekt: ''         # effekt in/ut, W eller kW             (ex. sensor.battery_power)
      _batteri_effekt_omvand: false   # true om sensorn visar PLUS när batteriet laddar UR
      _batteri_kapacitet: 0       # batteriets storlek i kWh, t.ex. 10 – ger "Fullt om …" / "Räcker ca …"

      # ---------- Förbrukning (valfritt – Tibber Pulse hittas automatiskt via _el_prefix) ----------
      _el_effekt: ''              # vad huset drar just nu, W           (ex. sensor.symfonigatan_7_power)
      _el_forbrukning_idag: ''    # förbrukat idag, kWh
      _el_kostnad_idag: ''        # kostnad idag, kr
      _el_apparater:              # "Vad kostar det?" – ungefärlig förbrukning per körning
        - namn: Diskmaskin
          ikon: mdi:dishwasher
          kwh: 1.1
          timmar: 2
        - namn: Tvättmaskin
          ikon: mdi:washing-machine
          kwh: 1
          timmar: 2
        - namn: Torktumlare
          ikon: mdi:tumble-dryer
          kwh: 2.5
          timmar: 2

      # ---------- Säkerhet ----------
      _larm: alarm_control_panel.alarmo
      _larm_skarm: true           # helskärm på surfplattan med nedräkning när larmet slås på/någon kommer in, och kamerabilder om larmet går
      _dorrar:
        - binary_sensor.altandorr_oppning
        - binary_sensor.entredorr_oppning
        - binary_sensor.balkongdorr_oppning
      _fonster: []
      _las: []
      _rorelse:
        - binary_sensor.rorelsevakt
      _larmgivare: []             # rök-, vatten-, gaslarm …
      _kameror: []                # tom lista = alla kameror (Frigate först)
      _forslag_oppen_minuter: 10  # Smart förslag säger till när en dörr/ett fönster stått öppet så här länge
      _kvall_kl: 22               # Smart förslag: efter detta klockslag föreslås "släck allt och stäng av tv:n"
      _kvall_dagar: vardag        # vardag (mån–fre) eller alla
      _kvall_minuter: 5           # nedräkning från att du trycker tills allt släcks

      # ---------- Väder och dagen ----------
      _vader: weather.hem
      _pollen_prefix: sensor.pollen_goteborg_
      _pollen_plats: Göteborg
      _smhi_prefix: sensor.smhi_odp_home_          # SMHI-sensorerna: vind, byar, riktning, molnbas, nederbörd …
      _smhi_varning: sensor.smhi_alerts_vastra_gotalands_lan
      _smhi_varning_aktiv: binary_sensor.smhi_alerts_active_vastra_gotalands_lan
      _mane: sensor.moon_fas
      _radar: false               # true = animerad regnradar överst i sidokortet (gör att det behöver skrollas)
      _norrsken: true             # norrskensprognos (NOAA) under Natthimlen
      _temp_inne: sensor.temp_vardagsrum_temperatur
      _att_gora: todo.att_komma_ihag
      _kalendrar: []              # tom lista = alla kalendrar

      # ---------- Hushållet (ta bort raden eller lämna tom om du inte har saken) ----------
      _kaffe: kaffemaskin         # början på Home Connect-entiteterna, t.ex. switch.kaffemaskin_av_pa
      _kaffe_modell: Siemens EQ900
      _dammsugare:                # en eller flera robotdammsugare
        - entity: vacuum.mova_e30_ultra
          namn: Mova E30 Ultra
          batteri: sensor.mova_e30_ultra_battery_level   # valfritt om roboten själv har batterinivå
          popup: '#dammsugare'     # valfritt – öppnar en pop-up (bubble-card) i stället för "Mer info"
        # - entity: vacuum.robot_ovanvaningen
        #   namn: Övervåningen
      # Bussen (t.ex. Västtrafik) – kortet visas på Hushåll. Lämna _buss tomt om du inte vill ha det.
      _buss: sensor.mot_centrum
      _buss_namn: Centrum         # "Mot Centrum"
      _buss_linje: 8              # används om sensorn inte själv anger linjen
      _buss_forvarning: 10        # påminnelsen kommer så här många minuter innan bussen går
      _buss_fonster: 30           # vill du åka 14:00 väljs sista bussen mellan 13:30 och 14:05
      _tts: ''                    # röst-tjänst, t.ex. tts.home_assistant_cloud – tomt = den första du har
      _tts_hogtalare: media_player.vardagsrum_3   # högtalaren som säger till
      # Servern (System Monitor) hittas automatiskt. Skriv _server: false för att dölja kortet.
      _server: ''
      _vaxter:
        - sensor: sensor.monstera_luftfuktighet
          namn: Monstera
          min: 30
          max: 60
        - sensor: sensor.utevaxer_luftfuktighet
          namn: Entréväxter
          min: 30
          max: 60

  # ══════════════════════════════════════════════════════════════════════════
  #  Själva appen – du behöver inte ändra något här nedanför.
  # ══════════════════════════════════════════════════════════════════════════
  aura_app:
    template: mitt_hem
    show_icon: false
    show_name: false
    show_state: false
    show_label: false
    triggers_update: all
    tap_action:
      action: none
    hold_action:
      action: none
    custom_fields:
      app: '[[[ return variables.motor ? window.Aura.render(this, variables) : ""; ]]]'
    styles:
      card:
        - background: none
        - border: none
        - border-radius: 0
        - box-shadow: none
        - padding: 0
        - overflow: visible
        - cursor: default
        - pointer-events: auto        # utan denna stänger button-card av alla tryck
        - '--mdc-ripple-color': transparent
        - '--mdc-ripple-press-opacity': 0
      grid:
        - grid-template-areas: '"app"'
        - grid-template-columns: 1fr
        - pointer-events: auto
      custom_fields:
        app:
          - width: 100%
          - justify-self: stretch
          - pointer-events: auto
    variables:
      motor: |
        [[[
          /* ═══════════════════════════════════════════════════════════════════════════
             AURA 2 · motorn bakom dashboarden
             Du behöver inte ändra något här – alla inställningar görs i "mitt_hem".
             ═══════════════════════════════════════════════════════════════════════════ */
          const VER = "3.5.1";
          if (!window.Aura || window.Aura.v !== VER) {
            const gammal = window.Aura;
            if (gammal && gammal.timer) clearInterval(gammal.timer);
            const A = window.Aura = {
              v: VER, kort: new Set(), opt: {}, kal: {}, todo: {}, todoSub: {}, vader: {}, vaderSub: {},
              sida: 'hem', rum: 'oversikt', spelare: '', mflik: 'bib', sok: null, bib: {}, kalla: {}, album: {}, spar: {}, ko: {},
              kaffeVal: null, las: null, drag: null, skalK: null, skalC: '', S: {}
            };
            const minne = (n, v) => { try { if (v === undefined) return localStorage.getItem('aura.' + n); localStorage.setItem('aura.' + n, v); } catch (e) {} return null; };
            A.sida = minne('sida') || 'hem'; A.rum = minne('rum') || 'oversikt'; A.spelare = minne('spelare') || ''; A.dammVal = +minne('damm') || 0; A.temaVal = minne('tema') || '';
            A.bussP = (() => { try { const x = JSON.parse(minne('buss') || 'null'); return x && x.t > Date.now() - 10 * 6e4 ? x : null; } catch (e) { return null; } })();
            try { A.kalla = JSON.parse(minne('kalla') || '{}') || {}; } catch (e) { A.kalla = {}; }

            if (!document.getElementById('aura-font')) {
              const l = document.createElement('link');
              l.id = 'aura-font'; l.rel = 'stylesheet';
              l.href = 'https://fonts.googleapis.com/css2?family=Manrope:wght@300..800&display=swap';
              document.head.appendChild(l);
            }

            // ───────────── Hjälpfunktioner ─────────────
            const S = (id) => id && A.hass && A.hass.states[id];
            const esc = A.esc = (t) => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            const tal = (id) => { const s = S(id); const v = s ? parseFloat(s.state) : NaN; return isNaN(v) ? null : v; };
            const ik = (i, px = 20) => `<ha-icon icon="${esc(i)}" style="--mdc-icon-size:${px}px;width:${px}px;height:${px}px;display:inline-flex;flex:none"></ha-icon>`;
            const namn = (id) => { const s = S(id); return s ? (s.attributes.friendly_name || id) : id; };
            const lista = (x) => Array.isArray(x) ? x.filter(Boolean) : x ? [x] : [];
            const kr = (v, d = 2) => v == null || isNaN(v) ? '–' : Number(v).toLocaleString('sv-SE', { minimumFractionDigits: d, maximumFractionDigits: d });
            const grad = (v) => v == null ? '–' : (Math.round(v * 10) / 10).toLocaleString('sv-SE');
            const klamp = (v, a, b) => Math.max(a, Math.min(b, v));
            const hh = (d) => String(d.getHours()).padStart(2, '0');
            const hm = (d) => d.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });
            const sedan = (ms) => { const m = Math.round((Date.now() - ms) / 6e4); return m < 1 ? 'nyss' : m < 60 ? `${m} min sedan` : m < 1440 ? `${Math.round(m / 60)} tim sedan` : `${Math.round(m / 1440)} d sedan`; };
            const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
            const forsta = (t) => t ? t.charAt(0).toUpperCase() + t.slice(1) : t;
            const ej = (s) => !s || ['unavailable', 'unknown'].includes(s.state);
            const tom = (t, i = 'mdi:information-outline') => `<div class="tom">${ik(i, 22)}<span>${t}</span></div>`;
            const kh = (ikon, titel, hoger = '') => `<div class="kh"><div class="kh-t"><span class="kh-ik">${ik(ikon, 17)}</span>${titel}</div>${hoger}</div>`;
            const PALETT = ['#E0A23B', '#E07A9B', '#5B8DEF', '#9B7BEA', '#3FB27F', '#E8834A', '#2CB5C9'];
            const CIRK = 2 * Math.PI * 46;
            A.fcss = (f) => /^\s*\d+\s*,\s*\d+\s*,\s*\d+\s*$/.test(String(f || '')) ? `rgb(${f})` : (f || '#E0A23B');
            A.vibb = (ms = 8) => { try { navigator.userActivation && navigator.userActivation.hasBeenActive && navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
            // Öppnar en pop-up via #hash (t.ex. bubble-card med hash: '#dammsugare'), på samma sätt som HA:s egen navigering
            A.popup = (h) => {
              if (!h) return;
              const hash = h.startsWith('#') ? h : '#' + h;
              history.pushState(null, '', location.pathname + location.search + hash);
              window.dispatchEvent(new CustomEvent('location-changed', { detail: { replace: false } }));
            };
            A.tj = (dom, tj, data) => A.hass.callService(dom, tj, data).catch(e => A.meddela((e && e.message) || 'Något gick fel'));
            A.meddela = (text) => {
              const el = [...A.kort].find(k => k.isConnected);
              if (el) el.dispatchEvent(new CustomEvent('hass-notification', { detail: { message: text }, bubbles: true, composed: true }));
            };
            A.info = (el, id) => el.dispatchEvent(new CustomEvent('hass-more-info', { bubbles: true, composed: true, detail: { entityId: id } }));
            const omradeFor = (id) => {
              const reg = A.hass.entities || {}, dev = A.hass.devices || {}, e = reg[id];
              return e ? (e.area_id || (e.device_id && dev[e.device_id] && dev[e.device_id].area_id) || '') : '';
            };
            A.farg = (s) => {
              const a = (s && s.attributes) || {};
              let rgb = Array.isArray(a.rgb_color) ? a.rgb_color : null;
              if (!rgb && a.color_temp_kelvin) {
                const k = a.color_temp_kelvin / 100;
                rgb = [k <= 66 ? 255 : 329.7 * Math.pow(k - 60, -0.1332), k <= 66 ? 99.47 * Math.log(k) - 161.12 : 288.12 * Math.pow(k - 60, -0.0755),
                  k >= 66 ? 255 : (k <= 19 ? 0 : 138.52 * Math.log(k - 10) - 305.04)];
              }
              if (!rgb) rgb = [255, 190, 110];
              return rgb.map(v => klamp(Math.round(v), 0, 255)).join(',');
            };
            A.ljus = (id) => {
              const s = S(id);
              if (!s) return { finns: false };
              const dom = id.split('.')[0], a = s.attributes;
              const dim = dom === 'light' && ((a.supported_color_modes || []).some(m => m !== 'onoff') || a.brightness != null);
              let on = s.state === 'on';
              let pct = on ? (a.brightness != null ? Math.max(1, Math.round(a.brightness / 2.55)) : 100) : 0;
              const o = A.opt[id];
              if (o) {
                if (Date.now() > o.till || (o.on === on && (o.pct == null || !on || Math.abs(o.pct - pct) <= 3))) delete A.opt[id];
                else { on = o.on; pct = !on ? 0 : o.pct != null ? o.pct : (pct || 100); }
              }
              return { finns: true, on, pct, dim, av: ej(s), c: A.farg(s), dom };
            };

            // ───────────── Inställningar ─────────────
            A.autoRum = () => {
              const h = A.hass, reg = h.entities || {}, omr = h.areas || {}, per = {};
              Object.keys(h.states).filter(id => id.startsWith('light.')).forEach(id => {
                const e = reg[id];
                if ((e && (e.hidden || e.entity_category)) || Array.isArray(h.states[id].attributes.entity_id)) return;
                const a = omradeFor(id) || '_';
                (per[a] = per[a] || []).push({ e: id });
              });
              return Object.keys(per).sort((x, y) => x === '_' ? 1 : y === '_' ? -1 : x.localeCompare(y)).map(a => {
                const sok = (dc) => a === '_' ? '' : Object.keys(h.states).find(id => id.startsWith('sensor.') && h.states[id].attributes.device_class === dc && omradeFor(id) === a) || '';
                return { namn: omr[a] ? omr[a].name : 'Övrigt', ikon: (omr[a] && omr[a].icon) || 'mdi:home-outline', temp: sok('temperature'), fukt: sok('humidity'), bild: (omr[a] && omr[a].picture) || '', lampor: per[a] };
              });
            };
            A.temaKlass = (t) => t === 'noir' ? 'mork noir' : t;
            // ── Servern (System Monitor): hittas automatiskt via integrationen, eller anges i _server ──
            A.serverHitta = (h, v) => {
              if (v._server === false || v._server === 'av') return null;
              const egna = v._server && typeof v._server === 'object' ? v._server : {}, reg = h.entities || {}, st = h.states;
              const N = { cpu: [/^processor_use/, /processor_use|processoranvandning|cpu_anvandning/], ram: [/^memory_use_percent/, /memory_use_percent|monitor_minnesanvandning/],
                disk: [/^disk_use_percent/, /disk_use_percent|diskanvandning/], temp: [/^processor_temperature/, /processor_temperature|processortemperatur/],
                boot: [/^last_boot/, /last_boot|senaste_uppstart|senaste_omstart|upptid/], swap: [/^swap_use_percent/, /swap_use_percent|virtuell_minnesanvandning/] };
              const sm = Object.keys(st).filter(id => id.startsWith('sensor.') && reg[id] && reg[id].platform === 'systemmonitor');
              const ut = {};
              for (const [n, [tk, re]] of Object.entries(N))
                ut[n] = egna[n] || sm.find(id => tk.test(reg[id].translation_key || '')) || sm.find(id => re.test(id)) || Object.keys(st).find(id => id.startsWith('sensor.system_monitor') && re.test(id)) || '';
              return Object.values(ut).some(Boolean) ? ut : null;
            };
            A.konf = (v) => {
              const h = A.hass;
              const lampa = (l) => typeof l === 'string' ? { e: l } : { e: l.entity || l.e, namn: l.namn, ikon: l.ikon, typ: l.typ };
              let rum = lista(v._rum).map(r => ({ namn: r.namn || 'Rum', ikon: r.ikon || 'mdi:home-outline', temp: r.temp || '', fukt: r.fukt || '', bild: r.bild || '', lampor: lista(r.lampor).map(lampa).filter(l => l.e) }));
              if (!rum.length) rum = A.autoRum();
              const scenLista = lista(v._scener).length ? lista(v._scener) : Object.keys(h.states).filter(id => id.startsWith('scene.')).slice(0, 8);
              const scener = scenLista.map(s => typeof s === 'string' ? { e: s } : { e: s.entity || s.e, namn: s.namn, ikon: s.ikon, farg: s.farg })
                .map((s, i) => Object.assign(s, { farg: A.fcss(s.farg || PALETT[i % PALETT.length]) }));
